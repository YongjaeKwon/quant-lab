name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Verify deterministic and idempotent demo seed
        run: |
          python -m scripts.seed_demo --reset --root data/ci --asof 2026-08-07
          python -m scripts.seed_demo --root data/ci --asof 2026-08-07
          python -m scripts.health_check --root data/ci --asof 2026-08-07

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix console/web

      - name: Run frontend tests
        run: npm test --prefix console/web

      - name: Build frontend
        run: npm run build --prefix console/web

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
