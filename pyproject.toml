[project]
name = "reachrich-public-lab"
version = "0.2.0"
description = "A public, synthetic-data companion to the private ReachRich investment operations project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<24",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["console*", "datastore*", "operation*", "strategy*", "universe*", "validation*"]
